policies:
- id: POL-001
  title: Data Protection and Privacy
  categories:
  - privacy
  - security
  - governance
  severity: critical
  rule: 'All personal data must be handled according to GDPR/CCPA principles:

    - Data minimization: collect only what''s needed

    - Purpose limitation: use data only for stated purposes

    - Storage limitation: delete data when no longer needed

    - Consent: obtain explicit consent before processing

    - Right to access: users can request their data

    - Right to deletion: users can request data deletion

    Prohibited: storing passwords in plaintext, logging PII, sharing user

    data with third parties without consent, using data for undisclosed purposes.

    '
  references:
  - GDPR Article 5 (Principles)
  - GDPR Article 17 (Right to erasure)
  - CCPA Section 1798.100
- id: POL-002
  title: Financial Compliance
  severity: critical
  rule: 'Any action involving financial transactions, trading, fund transfers,

    or capital allocation must:

    - Have explicit owner approval before execution

    - Be logged with timestamp, amount, and counterparty

    - Comply with anti-money-laundering (AML) requirements

    - Not involve sanctioned entities or jurisdictions

    - Be reversible or have a documented rollback plan

    Analysis and proposal are permitted; execution is gated.

    '
  references:
  - SEC Rule 10b-5 (Anti-fraud)
  - Bank Secrecy Act (AML requirements)
  - OFAC Sanctions List
  categories:
  - finance
- id: POL-003
  title: Intellectual Property
  severity: high
  rule: '- Do not use copyrighted material without license or fair use justification

    - Code generated by agents must not copy substantial portions of copyrighted code

    - Open-source licenses must be respected (GPL, MIT, Apache, etc.)

    - Proprietary algorithms and trade secrets must not be disclosed

    - Patents: do not implement patented methods without license

    '
  references:
  - DMCA (Digital Millennium Copyright Act)
  - US Copyright Act
  categories:
  - legal
- id: POL-004
  title: Export Control and Sanctions
  severity: critical
  rule: '- Do not export controlled technology to sanctioned countries

    - Do not provide services to entities on OFAC SDN list

    - Encryption software may be subject to export controls

    - Check jurisdiction before deploying services internationally

    '
  references:
  - ITAR (International Traffic in Arms Regulations)
  - EAR (Export Administration Regulations)
  - OFAC Sanctions Programs
  categories:
  - legal
- id: POL-005
  title: AI Ethics and Safety
  severity: high
  rule: '- Agents must not generate harmful, deceptive, or manipulative content

    - Agents must not impersonate real individuals without authorization

    - Automated decisions affecting individuals must be explainable

    - High-stakes decisions (health, legal, financial) require human review

    - Training data must be ethically sourced

    - Model outputs must be monitored for bias

    '
  references:
  - EU AI Act
  - NIST AI Risk Management Framework
  - OECD AI Principles
  categories:
  - ethics
- id: POL-006
  title: Infrastructure and Security
  severity: critical
  rule: '- Production infrastructure changes require owner approval

    - Secrets and API keys must never be logged, committed, or shared

    - All external API access must use encrypted connections (HTTPS)

    - Principle of least privilege: agents get minimum required access

    - Regular security audits of agent actions

    - Incident response: report security breaches immediately

    '
  references:
  - NIST Cybersecurity Framework
  - OWASP Top 10
  categories:
  - security
- id: POL-007
  title: Communications and Publishing
  severity: high
  rule: '- External communications require review before publishing

    - Social media posts must be approved by owner

    - Email campaigns must comply with CAN-SPAM Act

    - Marketing claims must be truthful and substantiated

    - Do not send unsolicited bulk communications

    '
  references:
  - CAN-SPAM Act
  - FTC Guidelines on Endorsements
  categories:
  - communications
- id: POL-008
  title: Labor and Employment
  severity: medium
  rule: '- Agent actions must not discriminate based on protected characteristics

    - Hiring-related decisions by agents must be auditable

    - Work product generated by agents belongs to the company

    - Agent output affecting employees must be reviewed by a human

    '
  references:
  - EEOC Guidelines
  - Fair Labor Standards Act
  categories:
  - legal
- id: POL-009
  title: Environmental and Sustainability
  severity: low
  rule: '- Consider environmental impact of compute-intensive operations

    - Prefer efficient models for routine tasks

    - Document carbon footprint of large training runs

    - Follow environmental regulations for hardware disposal

    '
  references:
  - Paris Agreement
  - EU Green Deal
  categories:
  - ethics
- id: POL-010
  title: Record Keeping and Audit
  severity: high
  rule: '- All agent actions must be logged with timestamp, agent, and outcome

    - Financial records must be retained for minimum 7 years

    - Audit logs must be immutable (append-only)

    - Deletion of records requires documented justification

    - Regular audit reviews of agent decision-making

    '
  references:
  - Sarbanes-Oxley Act (SOX)
  - SEC Recordkeeping Rules
  categories:
  - governance
