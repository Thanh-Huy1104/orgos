# orgos org constitution — a general-purpose company of AI agents.
# Departments, roles, SOPs, and policies. The orchestrator reads this at startup.
#
# Tools are Python objects — declare them in code. Skills paths, MCP configs,
# and model strings are declarative and safe to store here.

org:
  name: My Company
  description: A general-purpose AI agent company
  default_model: deepseek/deepseek-v4-pro
  # Per-agent token cap — a RUNAWAY SAFETY NET, not a tight cost lever. In a
  # ReAct loop most counted tokens are cache-hit re-feeds (~$0.0036/M on V4-Pro,
  # near-free), so a 150K-token research run still costs ~$0.01–0.03. The cap
  # exists to abort a genuine runaway (an unbounded web-fetch loop hit 406K in
  # testing) while letting legitimate multi-source research finish.
  default_max_budget_tokens: 150000
  # Ceiling on the WHOLE department run (all roles combined). The per-role cap
  # above is per-LLM, so a 3-role chain could legitimately reach ~450K; this
  # caps the aggregate so a chain can't bleed tokens role-by-role. A real
  # multi-source research run lands ~60–120K, so 250K leaves headroom while
  # still aborting a genuine runaway.
  default_max_run_tokens: 250000
  default_max_iter: 20
  owner:
    name: Thanh-Huy
    preferences: >
      Prefer clear, actionable output. Flag anything uncertain.
      Default to asking for approval on irreversible actions.
    notification_thresholds:
      token_spend_daily: 200000
      budget_exceeded_pct: 80
      consecutive_failures: 3
    communication:
      style: concise
      channels: [terminal]
    approval_rules:
      - pattern: "publish*"
        require_approval: true
      - pattern: "deploy*"
        require_approval: true
      - pattern: "bash rm*"
        require_approval: true
    feedback: []
  notification:
    type: terminal

departments:
  # ── Research: web search, analysis, report generation ──────────────────
  - name: research
    description: Web research, data analysis, report generation
    supervisor:
      name: research-lead
      tier: orchestrator
      system_prompt: |
        You lead a research team. Delegate web searches to researcher,
        then analysis to analyst. Synthesize findings into clear reports.
      model: deepseek/deepseek-v4-pro
      max_iter: 15
    members:
      - name: researcher
        tier: worker
        system_prompt: |
          Search the web and gather information. Use web_search to find
          sources, then web_fetch at most 2-3 of the most relevant. Be
          efficient — do not fetch every result; each fetch is costly. Cite
          your sources, then conclude.
        model: deepseek/deepseek-v4-pro
        max_iter: 6
      - name: analyst
        tier: validator
        system_prompt: |
          You analyze gathered information. Verify claims against sources.
          Identify patterns, contradictions, and gaps. Produce structured
          analysis with clear conclusions. Read-only.
        model: deepseek/deepseek-v4-pro
        max_iter: 5
        success_criteria:
          - Every claim verified against at least one source
          - Analysis includes patterns, gaps, and conclusions
    shared_mcps:
      - type: internet
    sops:
      - name: daily_briefing
        cadence: daily
        brief:
          objective: |
            Search for top technology and AI news from the past 24 hours.
            Summarize the 3 most important stories with sources.
          expected_output: Daily briefing with 3 top stories and sources.
          # Bounded delegation (P1): tell the worker where to look and cap its
          # tool calls. Surfaced in the prompt AND enforced in code.
          source_guidance: |
            Prefer reputable tech press and primary sources. One good source
            per story is enough — do not over-fetch.
          tool_call_budget: 8

  # ── Engineering: code, git, testing, project builds ───────────────────
  - name: engineering
    description: Code development, testing, git operations, project builds
    supervisor:
      name: eng-lead
      tier: orchestrator
      system_prompt: |
        You lead an engineering team. Delegate development tasks to developer,
        testing to tester. Review code changes before merging.
      model: deepseek/deepseek-v4-pro
      max_iter: 15
    members:
      - name: developer
        tier: worker
        system_prompt: |
          You write and modify code. Use git tools to create branches and
          check status. Use run_tests to verify changes. Write clean,
          documented code. Always test before declaring done.
        model: deepseek/deepseek-v4-pro
        max_iter: 20
      - name: tester
        tier: validator
        system_prompt: |
          You test code changes. Run the test suite, verify edge cases,
          check for regressions. Report pass/fail with specific failures.
          Read-only — do not modify code.
        model: deepseek/deepseek-v4-pro
        max_iter: 15
        success_criteria:
          - Every changed file has passing tests
          - Failures reported with specific error messages
    shared_mcps:
      - type: pm
    sops:
      - name: daily_build_check
        cadence: daily
        brief:
          objective: |
            Run the full test suite. Report any test failures.
            Check git status for uncommitted changes.
          expected_output: Build status report with test results and git status.

  # ── Operations: calendar, scheduling, personal assistant ──────────────
  - name: operations
    description: Calendar management, scheduling, daily assistance
    supervisor:
      name: ops-lead
      tier: orchestrator
      system_prompt: |
        You manage the owner's operations. Delegate calendar checks to
        calendar-agent, research tasks to research-agent. Keep things
        organized and on schedule.
      model: deepseek/deepseek-v4-pro
      max_iter: 15
    members:
      - name: calendar-agent
        tier: worker
        system_prompt: |
          Manage the owner's Google Calendar. Check schedules, find
          availability, list upcoming events. Use list_calendar_events
          to check the calendar. Report events clearly with times.
        model: deepseek/deepseek-v4-pro
        max_iter: 10
      - name: research-agent
        tier: worker
        system_prompt: |
          Research anything the owner asks about. Use web_search and
          web_fetch. Summarize findings concisely with sources.
        model: deepseek/deepseek-v4-pro
        max_iter: 12
    shared_mcps:
      - type: internet
      - type: gcal_tool
    shared_skills:
      - ./skills/operations
    sops:
      - name: daily_briefing
        cadence: daily
        brief:
          objective: |
            Check the owner's calendar for today and tomorrow. Summarize
            upcoming events, flag any scheduling conflicts.
          expected_output: Daily calendar briefing with event summary.

  # ── Compliance: policy review, legal checks ───────────────────────────
  - name: compliance
    description: Policy enforcement, legal review, risk assessment
    supervisor:
      name: compliance-lead
      tier: orchestrator
      system_prompt: |
        You lead compliance review. Delegate policy checks to reviewer.
        You have veto power on publish-class and deploy actions.
      model: deepseek/deepseek-v4-pro
      max_iter: 15
    members:
      - name: reviewer
        tier: validator
        system_prompt: |
          Review actions against compliance policy. Check every applicable
          rule. Cite specific policy IDs in your reasoning. Be precise —
          denials must reference which rule is violated.
        model: deepseek/deepseek-v4-pro
        max_iter: 12
        success_criteria:
          - Every applicable policy rule checked and cited by ID
          - Denials cite specific rule violations
    shared_skills:
      - ./skills/compliance
    shared_mcps:
      - type: internet
      - type: policy_bank
    sops:
      - name: review_proposal
        cadence: null
        brief:
          objective: |
            Review the provided action for policy compliance. Check all
            rules, return structured verdict with policy references.
          expected_output: Structured verdict with approved/denied/needs_changes.

handoffs:
  - from: engineering
    artifact_type: daily_build_check
    to: compliance
    auto_trigger: true
    note: "Build results reviewed for compliance before deployment."
  - from: research
    artifact_type: daily_briefing
    to: compliance
    auto_trigger: true
    note: "Research outputs reviewed for policy compliance."
