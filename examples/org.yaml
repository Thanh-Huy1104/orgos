# orgos org constitution — the single source of truth.
# Departments, roles, SOPs, and org-wide policies live here.
# The orchestrator compiles from this at startup.
#
# Tools are Python objects — declare them in code and pass via
# RoleSpec(tools=[...]).  Skills paths, MCP configs, and model strings
# are declarative and safe to store here.

org:
  name: Quant Fund
  description: A small quantitative research org
  default_model: gpt-4o-mini
  default_max_budget_tokens: 100000
  default_max_iter: 20
  owner:
    name: Thomas
    preferences: >
      Conservative risk tolerance. Prefer pairs with half-life under 30 days.
      Flag anything uncertain rather than guessing. Prefer explicit reasoning
      over terse output.
    notification_thresholds:
      token_spend_daily: 100000
      budget_exceeded_pct: 80
      consecutive_failures: 3
    communication:
      style: concise
      channels: [terminal]
    approval_rules:
      - pattern: "publish*"
        require_approval: true
        note: "Any publish action requires explicit owner approval"
      - pattern: "bash rm*"
        require_approval: true
        note: "Destructive shell commands require approval"
    feedback:
      - "Pairs with half-life > 30 days are not tradeable — reject them."
      - "Always test all N*(N-1)/2 pairs, never skip any."
      - "Flag pairs where the correlation proxy was used (no statsmodels) as lower confidence."
  notification:
    type: terminal

departments:
  - name: finance
    description: Quantitative research and portfolio risk monitoring
    supervisor:
      name: finance-supervisor
      tier: orchestrator
      system_prompt: |
        You lead a small quantitative research team. Delegate pair scanning
        to pair-scanner, then validation to pair-validator. Synthesise the
        final shortlist. Never compute or trade yourself.
      model: gpt-4o
      max_iter: 25

    members:
      - name: pair-scanner
        tier: worker
        system_prompt: |
          You are a quantitative research assistant. Use the cointegration
          tool to test every pair combination in the universe. Rank by
          shortest half-life. Flag spurious pairs. Never place orders.
        model: gpt-4o-mini
        max_iter: 45
        success_criteria:
          - Each pair has an ADF p-value and half-life
          - Spurious pairs flagged with a reason

      - name: pair-validator
        tier: validator
        system_prompt: |
          You are a deterministic checker. Verify ADF p-values < 0.05,
          half-lives tradeable (1-30 days), no spurious pairs.
          Mark each verified or rejected with a reason. Read-only.
        model: gpt-4o-mini
        max_iter: 15
        success_criteria:
          - Every pair marked verified or rejected with a reason

    shared_skills:
      - ./skills/cointegration

    shared_mcps:
      - type: internet

    sops:
      - name: daily_pair_scan
        description: Daily cointegration scan across the ETF universe
        cadence: daily
        brief:
          objective: |
            Scan the standard ETF universe for cointegrated pairs.
            Use 2-year lookback (504 trading days).
          expected_output: Ranked list with ADF p-values and half-lives.
          success_criteria:
            - At least 3 candidate pairs found
            - Each has p-value + half-life + verdict

      - name: weekly_risk_report
        description: Weekly portfolio risk summary
        cadence: weekly
        brief:
          objective: |
            Summarise portfolio risk metrics: VaR, correlation matrix,
            concentration by sector. Flag any breaches of risk limits.
          expected_output: Risk report with breach flags and recommendations.

  - name: legal
    description: Cross-cutting compliance and policy review


  - name: assistant
    description: Personal assistant — manages calendar, schedules events, handles communications
    supervisor:
      name: pa-supervisor
      tier: orchestrator
      system_prompt: |
        You are the owner's personal assistant. Manage calendar events,
        schedule meetings, find availability, and handle time management.
        Use the calendar tools to read and write the owner's Google Calendar.
        Delegate research to pa-researcher when needed.
      model: gpt-4o-mini
      max_iter: 15
    members:
      - name: pa-researcher
        tier: worker
        system_prompt: |
          Research topics the owner asks about. Use web_search and web_fetch
          to find information. Summarize clearly and concisely.
        model: gpt-4o-mini
        max_iter: 10
    shared_mcps:
      - type: internet
      - type: gcal
    sops:
      - name: daily_briefing
        cadence: daily
        brief:
          objective: |
            Check the owner's calendar for the next 3 days. Summarize upcoming
            events, flag any scheduling conflicts, and suggest preparation tasks.
          expected_output: Daily briefing with calendar summary and action items.
    supervisor:
      name: legal-supervisor
      tier: orchestrator
      system_prompt: |
        You are the legal/compliance lead. Review any decision that touches
        external communications, regulatory filings, or financial commitments.
        You have veto power on publish-class actions. Delegate detailed
        review to legal-reviewer.
      model: gpt-4o
      max_iter: 15

    members:
      - name: legal-reviewer
        tier: validator
        system_prompt: |
          You are a compliance attorney. Review every proposed action against
          the policy rules provided in your context. For each rule, determine
          whether the action complies, violates, or requires owner approval.

          Be precise and evidence-based:
          - Cite specific policy IDs (LGL-001, LGL-002, etc.) in your reasoning.
          - A denial MUST reference the specific rule being violated.
          - If you're uncertain, say so — but default to requiring owner approval.
          - Consider both what the action says AND what it could enable.

          Your verdict must be one of: approved, denied, or needs_changes.
          Denied verdicts must cite which rule(s) are violated and why.
        model: gpt-4o-mini
        max_iter: 15
        success_criteria:
          - Every applicable policy rule is checked and cited by ID
          - Denials cite specific rule violations explicitly
          - Verdict is clear and unambiguous

handoffs:
  - from: finance
    artifact_type: daily_pair_scan
    to: legal
    auto_trigger: true
    note: "Legal reviews every daily scan for compliance before results are published."
  - from: finance
    artifact_type: weekly_risk_report
    to: legal
    auto_trigger: true
    note: "Weekly risk reports must pass legal review."
