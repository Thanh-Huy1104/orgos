[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orgos"
version = "0.1.0"
description = "Agent Scrum Team Platform — deploy autonomous Scrum teams against a goal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "orgos contributors" },
]
keywords = ["agents", "scrum", "llm", "crewai", "autonomous"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "crewai>=1.0",       # agent engine (uses litellm under the hood)
  "pydantic>=2",       # RoleSpec / TaskBrief / HandoffEnvelope schemas
  "ruamel.yaml>=0.18", # persona YAML frontmatter parsing
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
orgos = "orgos.cli:main"

[project.urls]
Documentation = "https://github.com/example/orgos"
Source = "https://github.com/example/orgos"

[tool.setuptools.packages.find]
where = ["."]
include = ["orgos*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: tests that hit external APIs",
]
